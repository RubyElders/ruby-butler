[package]
name = "rb-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Ruby gem dependency resolution with PubGrub"

[dependencies]
pubgrub = "0.4"
rb-gem-types = { path = "../rb-gem-types" }

[dev-dependencies]
rb-compact-index = { path = "../rb-compact-index" }
rb-gemfile = { path = "../rb-gemfile" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
