[package]
name = "rb-gem-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone staged Ruby gem payload installation"

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
rb-gem-archive = { path = "../rb-gem-archive" }
rb-gem-types = { path = "../rb-gem-types" }
rb-microgems = { path = "../rb-microgems" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
sha2 = "0.10"
