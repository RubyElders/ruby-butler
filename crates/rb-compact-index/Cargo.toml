[package]
name = "rb-compact-index"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Cached RubyGems compact-index client"
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
alox-48 = { version = "0.7.1", default-features = false }
anyhow = "1.0"
base64 = "0.22"
flate2 = "1.1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.21"
