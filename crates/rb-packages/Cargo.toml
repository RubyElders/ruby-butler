[package]
name = "rb-packages"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Ruby bundle planning and conventional installation"

[dependencies]
anyhow = "1"
dunce = "1"
rb-compact-index = { path = "../rb-compact-index" }
rb-gem-archive = { path = "../rb-gem-archive" }
rb-gem-installer = { path = "../rb-gem-installer" }
rb-gem-types = { path = "../rb-gem-types" }
rb-gemfile = { path = "../rb-gemfile" }
rb-lockfile = { path = "../rb-lockfile" }
rb-microgems = { path = "../rb-microgems" }
rb-resolver = { path = "../rb-resolver" }
rb-task = { path = "../rb-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
url = "2"

flate2 = "1"
tar = "0.4"
