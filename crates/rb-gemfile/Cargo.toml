[package]
name = "rb-gemfile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evaluate Ruby Gemfiles into dependency manifests without Bundler"

[dependencies]
dunce = "1.0.5"
kdl = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.21.0"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
which = "6.0"
