[package]
name = "rb-ruby-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verified prebuilt CRuby installation for Linux and macOS"

[dependencies]
anyhow = "1"
flate2 = "1"
fs2 = "0.4"
rb-gem-types = { path = "../rb-gem-types" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[dev-dependencies]
rb-tests = { path = "../rb-tests" }
